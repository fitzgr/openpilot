name: Drive Buddy shadow validation
on:
  push:
    branches:
      - test/drivebuddy-release-mici
  pull_request:
    paths:
      - 'openpilot/drivebuddy_shadow/**'
      - 'openpilot/system/manager/process_config.py'
      - 'openpilot/system/manager/manager.py'
      - '.github/workflows/drivebuddy-shadow-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bridge Python sources
        run: python -m compileall -q openpilot/drivebuddy_shadow
      - name: Run shadow protocol and HTTP tests
        run: python -m unittest -v openpilot.drivebuddy_shadow.test_receiver
      - name: Ensure no vehicle-control module imports in bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('openpilot/drivebuddy_shadow').glob('*.py'):
              text = path.read_text()
              assert 'from openpilot.selfdrive.controls' not in text, path
              assert 'import opendbc.can.packer' not in text, path
          PY

  release-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install release-locked Python dependencies used by the bridge and launcher
        run: |
          python -m pip install pycapnp==2.1.0 numpy==2.5.3 pyzmq==27.2.0 setproctitle==1.3.7 zstandard==0.25.0
      - name: Build host msgq extension and run the managed telemetry smoke test
        shell: bash
        run: |
          native_dir="$(mktemp -d)"
          trap 'rm -rf "$native_dir"' EXIT
          cp -r msgq_repo/msgq "$native_dir/"
          g++ -std=c++17 -O2 -shared -fPIC -pthread \
            -I msgq_repo -I msgq_repo/msgq -I "$(python -c 'import sysconfig; print(sysconfig.get_path("include"))')" \
            msgq_repo/msgq/{ipc_pyx.cpp,ipc.cc,event.cc,impl_msgq.cc,impl_fake.cc,msgq.cc} \
            -o "$native_dir/msgq/ipc_pyx.so"
          PYTHONPATH="$native_dir:$PWD/opendbc_repo" \
            python -m unittest -v openpilot.drivebuddy_shadow.test_release_integration
